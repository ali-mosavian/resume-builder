[project]
name = "resume"
version = "0.1.0"
description = "A CV as a web page, PDF and .docx from one multilingual YAML."
requires-python = ">=3.12"
dependencies = ["python-docx~=1.2", "pyyaml~=6.0", "typer~=0.12"]

[project.scripts]
resume = "resume.cli:app"

[dependency-groups]
dev = ["fonttools", "isort~=6.1", "pytest", "ruff", "ty", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B", "SIM", "RUF", "PL", "PT"]
ignore = ["I", "E501", "PLR2004", "PLR0913", "RUF001"]  # I: isort sorts imports; E501: the formatter owns line length

[tool.isort]  # as CapCore/capcore_engine
profile = "black"
line_length = 120
force_single_line = true
length_sort = true
length_sort_sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
force_sort_within_sections = true
src_paths = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
extra-paths = ["tests"]
