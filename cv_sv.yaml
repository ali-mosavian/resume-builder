- Livslångt lärande med över två decenniers programmeringserfarenhet, verksam i IT-branschen sedan 2005
  och inom maskininlärning/djupinlärning sedan 2009. Där storskaliga internetsystem och maskininlärning/AI
  möts för att skapa oförglömliga användarupplevelser är där jag känner mig mest hemma.
