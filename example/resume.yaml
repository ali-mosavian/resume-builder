    in NLP and forecasting. Alex has taught me a lot about engineering and ML, and is always friendly, with an
    easy-going and pragmatic attitude. The ML knowledge is deep, which shows in how Alex forms very specific,
    knowledge driven hypotheses about what type of model or architecture is likely to improve the solution to a
