summary:
  en:
  - Experienced **hands-on** engineer, machine learning/AI specialist, generalist and ex-CTO with a passion for finding
    simple and unconventional ways of going from an **idea to a product** by being **pragmatic, curious, focused
    and above all shipping early.**
  - A life long learner with over fifteen years of programming experience, working in the IT industry since 2008 and
    working with machine learning since 2016. The intersection where scalable data systems and machine
    learning/AI meet to make up a product people love is where I feel at home.
  sv:
  - Erfaren **hands-on**-ingenjör, specialist inom machine learning/AI, generalist och före detta CTO med passion för
    att hitta enkla och okonventionella vägar från **idé till produkt** genom att vara **pragmatisk, nyfiken,
    fokuserad och framför allt leverera tidigt.**
  - Livslångt lärande med över femton års programmeringserfarenhet, verksam i IT-branschen sedan 2008 och inom
    machine learning sedan 2016. Där skalbara datasystem och machine learning/AI möts för att skapa en
    produkt som människor älskar är där jag känner mig hemma.
