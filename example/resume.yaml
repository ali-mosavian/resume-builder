summary:
  en:
  - Machine learning engineer who likes the whole path from messy data to a **model people rely on**. Steady, curious
    and direct, with a habit of measuring before optimising.
  - Twelve years in software and eight in machine learning, mostly in forecasting, recommendations and computer
    vision. Happiest where **solid engineering** and applied statistics meet in a product that keeps working
    after launch.
  de:
  - Machine-Learning-Ingenieurin, die den ganzen Weg von unordentlichen Daten zu einem **Modell, auf das man sich verlässt**,
    mag. Beständig, neugierig und direkt, mit der Gewohnheit, zu messen, bevor sie optimiert.
  - Zwölf Jahre Softwareentwicklung und acht Jahre Machine Learning, überwiegend in Prognosen, Empfehlungssystemen
    und Computer Vision. Am wohlsten dort, wo **solides Engineering** und angewandte Statistik in einem Produkt
    zusammenkommen, das auch nach dem Launch zuverlässig läuft.
