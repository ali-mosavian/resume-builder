testimonials:
- name: Simon Celinder
  role: Data Scientist, KRY/Livi, Stockholm
  quote:
  - It is rare to come across someone who has both such a depth and breadth in engineering as Ali. He has long experience
    in the Machine Learning space, but also in software engineering. I’m currently working closely with Ali in developing
    machine learning models at the digital healthcare provider Kry, collaborating on problems in NLP and forecasting.
    He has taught me a lot about engineering and ML, and he is always friendly, with an easy-going and pragmatic
    attitude. He’s ML knowledge is deep, which shows in how he has very knowledge driven and specific hypotheses
    about what type of model or architecture that is likely to improve the solution to a specific problem. He is
    a source of inspiration for the rest of the team, constantly staying ahead of the curve, exploring new tools
    and coming with creative ideas. I would recommend Ali to any company that wants to take data science to the
    next level.
