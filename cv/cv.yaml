summary:
  en:
  - Experienced **hands-on** engineer, machine learning/AI expert, generalist and ex-CTO with passion for finding
    efficient and unconventional ways of going from an **idea to a product** by being **pragmatic, focused, out-of-the-box
    thinking and above all moving fast.**
  - A life long learner with over two decades of programming experience, working in the IT industry since 2005 and
    working with machine learning/deep learning since 2009. The intersection where internet scale systems, machine
    learning/AI meet to make up unforgettable user experience is where I feel at most home.
  sv:
  - Erfaren **hands-on**-ingenjör, expert inom machine learning/AI, generalist och före detta CTO med passion för
    att hitta effektiva och okonventionella vägar från **idé till produkt** genom att vara **pragmatisk, fokuserad,
    tänka utanför boxen och framför allt röra mig snabbt.**
  - Livslångt lärande med över två decenniers programmeringserfarenhet, verksam i IT-branschen sedan 2005 och inom
    machine learning/deep learning sedan 2009. Där storskaliga internetsystem och machine learning/AI möts för att
    skapa oförglömliga användarupplevelser är där jag känner mig mest hemma.
